---
- name: Wait for FireEdge key to appear (ha)
  ansible.builtin.wait_for:
    path: &fireedge_key /var/lib/one/.one/fireedge_key
    timeout: 60
  when: inventory_hostname == leader

- name: Stat /var/lib/one/.one/fireedge_key (ha)
  ansible.builtin.stat:
    path: *fireedge_key
    get_attributes: false
    get_checksum: true
    get_mime: false
  register: stat

- name: Detect if FireEdge key has been replicated (ha)
  ansible.builtin.set_fact:
    key_ok: >-
      {{ _exist_ok and _cksum_ok }}
  vars:
    _exist_ok: >-
      {{ _stat | map(attribute='exists') | list is all }}
    _cksum_ok: >-
      {{ _stat | map(attribute='checksum') | list | unique | count == 1 }}
    _stat: >-
      {{ [inventory_hostname, leader] | unique | map('extract', hostvars, ['stat', 'stat']) | list }}
  when: inventory_hostname != leader

- name: Combine all results (ha)
  ansible.builtin.set_fact:
    all_key_ok: >-
      {{ _followers | map('extract', hostvars, ['key_ok']) is all }}
  vars:
    _followers: >-
      {{ federation.groups.frontend | reject('in', [leader]) }}
  when: inventory_hostname == leader

- always:
    - name: Remove fireedge-leader.tar.gz (cleanup)
      ansible.builtin.file:
        path: &fireedge_leader_tar_gz /var/tmp/fireedge-leader.tar.gz
        state: absent
  block:
    - when:
        - inventory_hostname == leader
        - not all_key_ok
      block:
        - name: Archive FireEdge data (ha)
          community.general.archive:
            dest: *fireedge_leader_tar_gz
            path:
              - *fireedge_key
            format: gz
            remove: false
            force_archive: true
            owner: "{{ ansible_user }}"
            mode: u=rw,go=
          no_log: true

    - when:
        - inventory_hostname != leader
        - not key_ok
      block:
        - name: Transfer FireEdge artifact through the controller
          no_log: true
          block:
            - name: Create private FireEdge controller transfer directory
              ansible.builtin.tempfile:
                state: directory
                prefix: one-deploy-fireedge-
              delegate_to: localhost
              become: false
              register: fireedge_transfer

            - name: Fetch FireEdge artifact through verified controller SSH
              ansible.builtin.fetch:
                src: *fireedge_leader_tar_gz
                dest: "{{ fireedge_transfer.path }}/fireedge-leader.tar.gz"
                flat: true
                validate_checksum: true
              delegate_to: "{{ leader }}"
              become: false

            - name: Copy FireEdge artifact through verified controller SSH
              ansible.builtin.copy:
                src: "{{ fireedge_transfer.path }}/fireedge-leader.tar.gz"
                dest: *fireedge_leader_tar_gz
                mode: '0600'

          always:
            - name: Remove private FireEdge controller transfer directory
              ansible.builtin.file:
                path: "{{ fireedge_transfer.path }}"
                state: absent
              delegate_to: localhost
              become: false
              when: fireedge_transfer is defined and fireedge_transfer.path is defined

        - name: Unarchive FireEdge data into /var/lib/one/.one/ (ha)
          ansible.builtin.unarchive:
            dest: /var/lib/one/.one/
            src: *fireedge_leader_tar_gz
            remote_src: true
          no_log: true
