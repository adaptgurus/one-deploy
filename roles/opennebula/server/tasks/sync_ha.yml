---
- name: Stat /var/lib/one/.one/one_auth (ha)
  ansible.builtin.stat:
    path: /var/lib/one/.one/one_auth
    get_attributes: false
    get_checksum: true
    get_mime: false
  register: stat

- name: Detect if AUTH info has been replicated (ha)
  ansible.builtin.set_fact:
    auth_ok: >-
      {{ _exist_ok and _cksum_ok }}
  vars:
    _exist_ok: >-
      {{ _stat | map(attribute='exists') | list is all }}
    _cksum_ok: >-
      {{ _stat | map(attribute='checksum') | list | unique | count == 1 }}
    _stat: >-
      {{ [inventory_hostname, leader] | map('extract', hostvars, ['stat', 'stat']) | list }}
  when: inventory_hostname != leader

- name: Stat /var/lib/one/.ssh/id_rsa (ha)
  ansible.builtin.stat:
    path: /var/lib/one/.ssh/id_rsa
    get_attributes: false
    get_checksum: true
    get_mime: false
  register: stat

- name: Detect if SSH key has been replicated (ha)
  ansible.builtin.set_fact:
    key_ok: >-
      {{ _exist_ok and _cksum_ok }}
  vars:
    _exist_ok: >-
      {{ _stat | map(attribute='exists') | list is all }}
    _cksum_ok: >-
      {{ _stat | map(attribute='checksum') | list | unique | count == 1 }}
    _stat: >-
      {{ [inventory_hostname, leader] | unique | map('extract', hostvars, ['stat', 'stat']) | list }}
  when: inventory_hostname != leader

- name: Get DB version info (ha)
  ansible.builtin.shell:
    cmd: |
      onedb version -t '{{ db_backend_types[db_backend] }}' \
                    -u '{{ db_owner }}' \
                    -p '{{ db_password }}' \
                    -d '{{ db_name }}'
    executable: /bin/bash
  changed_when: false
  register: shell
  ignore_errors: true

- name: Detect if DB has been replicated (ha)
  ansible.builtin.set_fact:
    db_ok: >-
      {{ shell is success }}

- name: Combine all results (ha)
  ansible.builtin.set_fact:
    all_key_ok: >-
      {{ _followers | map('extract', hostvars, ['key_ok']) is all }}
    all_auth_ok: >-
      {{ _followers | map('extract', hostvars, ['auth_ok']) is all }}
    all_db_ok: >-
      {{ _followers | map('extract', hostvars, ['db_ok']) is all }}
  vars:
    _followers: >-
      {{ federation.groups.frontend | reject('in', [leader]) }}
  when: inventory_hostname == leader

- always: # noqa key-order[task]
    - name: Remove leader.tar.gz (cleanup)
      ansible.builtin.file:
        path: &leader_tar_gz /var/tmp/leader.tar.gz
        state: absent
  block:
    - when:
        - inventory_hostname == leader
        - not (all_auth_ok and all_key_ok)
      block:
        - name: Archive AUTH and SSH data (ha)
          community.general.archive:
            dest: *leader_tar_gz
            path:
              - /var/lib/one/.one
              - /var/lib/one/.ssh
            format: gz
            remove: false
            force_archive: true
            owner: "{{ ansible_user }}"
            mode: u=rw,go=

    - when:
        - inventory_hostname != leader
        - not (auth_ok and key_ok)
      block:
        # Controller mediation keeps its SSH identity off the managed nodes.
        # Fetch/copy use Ansible's configured strict host-key verification.
        - name: Distribute AUTH and SSH data through the controller (ha)
          no_log: true
          block:
            - name: Allocate private controller transfer directory
              ansible.builtin.tempfile:
                state: directory
                prefix: one-ha-sync-
              delegate_to: localhost
              become: false
              register: ha_controller_transfer

            - name: Fetch leader artifact through verified controller SSH
              ansible.builtin.fetch:
                src: *leader_tar_gz
                dest: "{{ ha_controller_transfer.path }}/artifact"
                flat: true
                validate_checksum: true
              delegate_to: "{{ leader }}"

            - name: Copy artifact through verified controller SSH
              ansible.builtin.copy:
                src: "{{ ha_controller_transfer.path }}/artifact"
                dest: *leader_tar_gz
                owner: "{{ ansible_user }}"
                mode: '0600'
          always:
            - name: Remove private controller transfer directory
              ansible.builtin.file:
                path: "{{ ha_controller_transfer.path }}"
                state: absent
              delegate_to: localhost
              become: false
              when: ha_controller_transfer.path is defined

        - name: Unarchive AUTH and SSH data into /var/lib/one/ (ha)
          ansible.builtin.unarchive:
            dest: /var/lib/one/
            src: *leader_tar_gz
            remote_src: true

- always: # noqa key-order[task]
    - name: Remove db_leader.sql.gz (cleanup)
      ansible.builtin.file:
        path: &db_leader_sql_gz /var/tmp/db_leader.sql.gz
        state: absent
  block:
    - when:
        - inventory_hostname == leader
        - not all_db_ok
      block:
        - name: Create DB backup (ha)
          ansible.builtin.shell:
            cmd: |
              onedb backup -f -t '{{ db_backend_types[db_backend] }}' \
                              -u '{{ db_owner }}' \
                              -p '{{ db_password }}' \
                              -d '{{ db_name }}' /var/tmp/db_leader.sql
            executable: /bin/bash
          changed_when: true

        - name: Compress DB backup (ha)
          community.general.archive:
            dest: *db_leader_sql_gz
            path: /var/tmp/db_leader.sql
            format: gz
            remove: true
            force_archive: false
            owner: "{{ ansible_user }}"
            mode: u=rw,go=

    - when:
        - inventory_hostname != leader
        - not db_ok
      block:
        # Controller mediation keeps its SSH identity off the managed nodes.
        # Fetch/copy use Ansible's configured strict host-key verification.
        - name: Distribute DB backup through the controller (ha)
          no_log: true
          block:
            - name: Allocate private controller transfer directory
              ansible.builtin.tempfile:
                state: directory
                prefix: one-ha-sync-
              delegate_to: localhost
              become: false
              register: ha_controller_transfer

            - name: Fetch leader artifact through verified controller SSH
              ansible.builtin.fetch:
                src: *db_leader_sql_gz
                dest: "{{ ha_controller_transfer.path }}/artifact"
                flat: true
                validate_checksum: true
              delegate_to: "{{ leader }}"

            - name: Copy artifact through verified controller SSH
              ansible.builtin.copy:
                src: "{{ ha_controller_transfer.path }}/artifact"
                dest: *db_leader_sql_gz
                owner: "{{ ansible_user }}"
                mode: '0600'
          always:
            - name: Remove private controller transfer directory
              ansible.builtin.file:
                path: "{{ ha_controller_transfer.path }}"
                state: absent
              delegate_to: localhost
              become: false
              when: ha_controller_transfer.path is defined

        - name: Restore DB backup (ha)
          ansible.builtin.shell:
            cmd: |
              set -o errexit -o pipefail
              zcat '{{ _db_leader_sql_gz }}' | onedb restore -t '{{ db_backend_types[db_backend] }}' \
                                                             -u '{{ db_owner }}' \
                                                             -p '{{ db_password }}' \
                                                             -d '{{ db_name }}' /dev/fd/0
            executable: /bin/bash
          changed_when: true
          vars:
            _db_leader_sql_gz: *db_leader_sql_gz
