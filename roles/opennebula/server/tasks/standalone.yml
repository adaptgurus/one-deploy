---
- ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/ha.yml"
  when: use_ha is true

- ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/solo.yml"
  when: use_ha is false

- ansible.builtin.include_role:
    name: opennebula/leader

- name: Reconcile standalone HA zone endpoint through native API
  when:
    - use_ha is true
    - one_vip is defined
    - inventory_hostname == leader
  become: true
  become_user: oneadmin
  block:
    - name: Read standalone HA zone endpoint
      ansible.builtin.command:
        argv: [onezone, show, "{{ zone_name }}", --json]
      register: standalone_zone
      changed_when: false

    - name: Publish the configured HA VIP in the standalone zone
      when: (standalone_zone.stdout | from_json).ZONE.TEMPLATE.ENDPOINT != 'http://' ~ one_vip ~ ':2633/RPC2'
      block:
        - name: Allocate protected zone endpoint template
          ansible.builtin.tempfile:
            state: file
            prefix: onezone-endpoint-
          register: zone_endpoint_template

        - name: Render zone endpoint template
          ansible.builtin.copy:
            dest: "{{ zone_endpoint_template.path }}"
            mode: '0600'
            content: |
              ENDPOINT = "http://{{ one_vip }}:2633/RPC2"

        - name: Append the configured HA VIP through the native CLI
          ansible.builtin.command:
            argv:
              - onezone
              - update
              - "{{ zone_name }}"
              - --append
              - "{{ zone_endpoint_template.path }}"
          changed_when: true

        - name: Read standalone HA zone endpoint after update
          ansible.builtin.command:
            argv: [onezone, show, "{{ zone_name }}", --json]
          register: standalone_zone_after
          changed_when: false

        - name: Require exact HA VIP endpoint readback
          ansible.builtin.assert:
            that:
              - (standalone_zone_after.stdout | from_json).ZONE.TEMPLATE.ENDPOINT == 'http://' ~ one_vip ~ ':2633/RPC2'
      always:
        - name: Remove protected zone endpoint template
          ansible.builtin.file:
            path: "{{ zone_endpoint_template.path }}"
            state: absent
          when: zone_endpoint_template.path is defined